<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daily Tarot Card</title>
  <style>
    body {
      background-color: #1a1a2e;
      color: #fff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px 10px;
      text-align: center;
      box-sizing: border-box;
    }
    h2 {
      color: #f39c12;
      margin-bottom: 20px;
      font-size: 24px;
    }
    .wheel-container {
      position: relative;
      width: 180px;
      height: 180px;
      margin-bottom: 20px;
    }
    .wheel {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      border: 6px solid #f39c12;
      background: conic-gradient(#e74c3c 0deg 90deg, #3498db 90deg 180deg, #9b59b6 180deg 270deg, #2ecc71 270deg 360deg);
      transition: transform 3s cubic-bezier(0.25, 0.1, 0.25, 1);
      box-shadow: 0 0 15px rgba(243, 156, 18, 0.4);
    }
    button {
      padding: 12px 30px;
      font-size: 18px;
      font-weight: bold;
      background-color: #f39c12;
      color: #1a1a2e;
      border: none;
      border-radius: 25px;
      cursor: pointer;
      margin-top: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      transition: transform 0.2s, background-color 0.2s;
    }
    button:active {
      transform: scale(0.95);
      background-color: #e67e22;
    }
    #result-container {
      margin-top: 20px;
      width: 100%;
      max-width: 350px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    #result {
      font-size: 18px;
      font-weight: bold;
      color: #f1c40f;
      margin-bottom: 10px;
      min-height: 27px;
    }
    #card-image {
      width: 180px;
      height: auto;
      border-radius: 10px;
      margin: 15px 0;
      display: none;
      box-shadow: 0 4px 15px rgba(0,0,0,0.6);
      border: 2px solid #f39c12;
    }
    .details {
      text-align: left;
      background: rgba(255, 255, 255, 0.07);
      padding: 15px;
      border-radius: 12px;
      display: none;
      width: 100%;
      box-sizing: border-box;
      backdrop-filter: blur(5px);
      border: 1px solid rgba(255,255,255,0.1);
    }
    .details p {
      margin: 10px 0;
      font-size: 14px;
      line-height: 1.5;
    }
    .highlight {
      color: #f1c40f;
      font-weight: bold;
    }
    footer {
      margin-top: 30px;
      font-size: 13px;
      color: #aaa;
      border-top: 1px solid #333;
      padding-top: 15px;
      width: 100%;
      max-width: 350px;
    }
    .visitor-count {
      margin-top: 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
    }
    .visitor-count p {
      margin: 0;
      font-size: 13px;
      color: #aaa;
    }
  </style>
</head>
<body>

  <h2>✨ ဒီနေ့အတွက် Tarot ✨</h2>

  <div class="wheel-container">
    <div class="wheel" id="wheel"></div>
  </div>

  <button onclick="drawCard()">ကတ်ဆွဲမည်</button>

  <div id="result-container">
    <div id="result"></div>
    <img id="card-image" src="" alt="Tarot Card">
    <div id="card-details" class="details">
      <p><span class="highlight">✨ အဓိပ္ပါယ်:</span> <span id="meaning"></span></p>
      <p><span class="highlight">❤️ အချစ်ရေး:</span> <span id="love"></span></p>
      <p><span class="highlight">💰 ငွေကြေး:</span> <span id="money"></span></p>
      <p><span class="highlight">⚠️ သတိထားရန်:</span> <span id="warning"></span></p>
      <p><span class="highlight">🍀 အဆောင်/ယတြာ:</span> <span id="lucky"></span></p>
    </div>
  </div>

  <!-- မန်တီးသူ နာမည် -->
  <footer>
    <p>Created with ❤️ by <b>ဇေယျာထက်</b></p>
  </footer>

  <!-- ကြည့်ရှုသူဦးရေပြ ဘာဂျ် -->
  <div class="visitor-count">

    // Combine All 78 Cards
    let tarotCards = [...majorArcana];

    suits.forEach(suit => {
      ranks.forEach(rank => {
        let cardTitle = `${rank.displayName} of ${suit.name.charAt(0).toUpperCase() + suit.name.slice(1)}`;
        let imgUrl = `https://raw.githubusercontent.com/fabiocalcinaro/tarot-cards/master/cards/${suit.name}-${rank.rank}.jpg`;
        
        tarotCards.push({
          name: `${cardTitle} (${suit.myName})`,
          img: imgUrl,
          meaning: `${rank.meaning} - ${suit.myName}`,
          love: rank.love,
          money: rank.money,
          warning: rank.warning,
          lucky: `${suit.color} ဝတ်ဆင်ပါ/ဆောင်ပါ`
        });
      });
    });

    let currentRotation = 0;

    function drawCard() {
      const wheel = document.getElementById('wheel');
      const result = document.getElementById('result');
      const cardImg = document.getElementById('card-image');
      const cardDetails = document.getElementById('card-details');

      result.innerText = "ကတ်ရွေးချယ်နေသည်...";
      cardImg.style.display = "none";
      cardDetails.style.display = "none";

      const randomDegree = Math.floor(Math.random() * 360) + 1440; // Spin at least 4 full rounds
      currentRotation += randomDegree;
      wheel.style.transform = `rotate(${currentRotation}deg)`;

      setTimeout(() => {
        const randomIndex = Math.floor(Math.random() * tarotCards.length);
        const card = tarotCards[randomIndex];

        result.innerText = "ကျရောက်သောကတ် - " + card.name;
        cardImg.src = card.img;
        cardImg.style.display = "block";

        document.getElementById('meaning').innerText = card.meaning;
        document.getElementById('love').innerText = card.love;
        document.getElementById('money').innerText = card.money;
        document.getElementById('warning').innerText = card.warning;
        document.getElementById('lucky').innerText = card.lucky;
