      color: #fff;

    // Web Audio Context for Sound Effects
    let audioCtx = null;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
    }

    // Wheel Spinning Tick Sound
    function playSpinSound() {
      initAudio();
      let count = 0;
      let maxTicks = 20;
      let interval = 80;

      function tick() {
        if (count >= maxTicks) return;
        
        let osc = audioCtx.createOscillator();
        let gain = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(400 + (count * 15), audioCtx.currentTime);
        
        gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start();
        osc.stop(audioCtx.currentTime + 0.05);

        count++;
        interval += 8; // Slower over time
        setTimeout(tick, interval);
      }
      tick();
    }

    // Card Reveal Chime Sound
    function playRevealSound() {
      initAudio();
      const notes = [523.25, 659.25, 783.99, 1046.50]; // C5, E5, G5, C6
      notes.forEach((freq, index) => {
        let osc = audioCtx.createOscillator();
        let gain = audioCtx.createGain();
        
        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime + (index * 0.1));

        gain.gain.setValueAtTime(0.08, audioCtx.currentTime + (index * 0.1));
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + (index * 0.1) + 0.4);

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start(audioCtx.currentTime + (index * 0.1));
        osc.stop(audioCtx.currentTime + (index * 0.1) + 0.4);
      });
    }

    let tarotCards = [...majorArcana];

    suits.forEach(suit => {
      let suitCapital = suit.name.charAt(0).toUpperCase() + suit.name.slice(1);
      ranks.forEach(rank => {
        let cardTitle = `${rank.displayName} of ${suitCapital}`;
        let imgUrl = `https://sacred-texts.com/tarot/pkt/img/${suit.prefix}${rank.rank}.jpg`;
        
        tarotCards.push({
          name: `${cardTitle} (${suit.myName})`,
          img: imgUrl,
          meaning: `${rank.meaning} - ${suit.myName}`,
          love: rank.love,
          money: rank.money,
          warning: rank.warning,
          lucky: `${suit.color} ဝတ်ဆင်ပါ/ဆောင်ပါ`
        });
      });
    });

    let currentRotation = 0;

    function drawCard() {
      playSpinSound(); // Start wheel sound

      const wheel = document.getElementById('wheel');
      const result = document.getElementById('result');
      const cardImg = document.getElementById('card-image');
      const cardDetails = document.getElementById('card-details');

      result.innerText = "ကတ်ရွေးချယ်နေသည်...";
      cardImg.style.display = "none";
      cardDetails.style.display = "none";

      const randomDegree = Math.floor(Math.random() * 360) + 1440;
      currentRotation += randomDegree;
      wheel.style.transform = `rotate(${currentRotation}deg)`;

      setTimeout(() => {
        playRevealSound(); // Play reveal chime sound

        const randomIndex = Math.floor(Math.random() * tarotCards.length);
        const card = tarotCards[randomIndex];

        result.innerText = "ကျရောက်သောကတ် - " + card.name;
        cardImg.src = card.img;
        cardImg.style.display = "block";

        document.getElementById('meaning').innerText = card.meaning;
        document.getElementById('love').innerText = card.love;
        document.getElementById('money').innerText = card.money;
        document.getElementById('warning').innerText = card.warning;
        document.getElementById('lucky').innerText = card.lucky;

        cardDetails.style.display = "block";
      }, 3000);
    }
